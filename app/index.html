<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BEJÚ Studio</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h10"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
</svg>

<div class="shell" id="shell">
  <aside class="side" id="side" hidden>
    <a class="logo" href="#/"><img src="../beju-mark-sm.png" alt="" width="34" height="34"><span><b>BEJÚ</b><small>Client studio</small></span></a>
    <nav class="nav">
      <a href="#/"><svg><use href="#i-home"/></svg>Dashboard</a>
      <a href="#/new"><svg><use href="#i-plus"/></svg>New Short</a>
      <a href="#/shorts"><svg><use href="#i-film"/></svg>My Shorts</a>
      <a href="#/packs"><svg><use href="#i-bag"/></svg>Packs</a>
      <p class="nav-h adm" hidden>Founders</p>
      <a href="#/team" class="adm" hidden><svg><use href="#i-bolt"/></svg>Overview</a>
      <a href="#/today" class="adm" hidden><svg><use href="#i-clock"/></svg>Today</a>
      <a href="#/outreach" class="adm" hidden><svg><use href="#i-mail"/></svg>Outreach</a>
      <a href="#/funnel" class="adm" hidden><svg><use href="#i-chart"/></svg>Funnel &amp; money</a>
      <a href="#/replies" class="adm" hidden><svg><use href="#i-mail"/></svg>Replies</a>
      <a href="#/samples" class="adm" hidden><svg><use href="#i-film"/></svg>Samples</a>
      <a href="#/leads" class="adm" hidden><svg><use href="#i-bell"/></svg>Leads</a>
      <a href="#/clients" class="adm" hidden><svg><use href="#i-star"/></svg>Clients</a>
      <a href="#/admin" class="adm" hidden><svg><use href="#i-shield"/></svg>Orders</a>
    </nav>
    <div class="me" id="me"></div>
  </aside>

  <div class="main">
    <header class="mbar" id="mbar" hidden>
      <a class="logo" href="#/"><img src="../beju-mark-sm.png" alt="" width="28" height="28"><b>BEJÚ</b></a>
      <a class="btn btn-dark btn-sm" href="#/new"><svg><use href="#i-plus"/></svg>New Short</a>
    </header>
    <div id="demo-bar" class="demo-bar" hidden>Demo mode: everything is saved in this browser only. <button id="demo-reset" class="linkish">Reset</button></div>
    <main id="view" aria-live="polite"></main>
  </div>
</div>

<nav class="tabbar" id="tabbar" hidden>
  <a href="#/"><svg><use href="#i-home"/></svg>Home</a>
  <a href="#/shorts"><svg><use href="#i-film"/></svg>Shorts</a>
  <a href="#/new" class="tab-plus"><svg><use href="#i-plus"/></svg></a>
  <a href="#/packs"><svg><use href="#i-bag"/></svg>Packs</a>
  <a href="#/account"><svg><use href="#i-out"/></svg>Account</a>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
